<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Join Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="text-slate-100">
    <div class="page-bg"></div>

    <header class="sticky top-3 z-50 mx-auto mt-4 w-[min(1240px,calc(100%-1.5rem))] rounded-2xl glass-card neon-border px-4 py-3 md:px-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <a class="flex items-center gap-2 text-2xl font-black text-orange-400" href="index.html">🎮 GameVerse</a>
        <nav class="flex items-center gap-6 text-sm font-semibold text-slate-100/90">
          <a class="transition hover:text-orange-200" href="index.html">Home</a>
          <a class="transition hover:text-orange-200" href="#">Leaderboard</a>
          <a class="relative text-orange-200 after:absolute after:-bottom-2 after:left-0 after:h-[2px] after:w-full after:bg-orange-400 after:shadow-[0_0_12px_rgba(255,122,28,0.8)]" href="join-team.html">Join Team</a>
        </nav>
        <div class="flex items-center gap-2">
          <button class="rounded-lg border border-purple-400/50 bg-slate-900/70 px-4 py-2 text-sm font-semibold">Logout</button>
          <button class="rounded-full border border-purple-400/60 bg-black/35 p-2 shadow-[0_0_14px_rgba(138,92,255,0.35)]">👾</button>
        </div>
      </div>
    </header>

    <main class="mx-auto w-[min(1240px,calc(100%-1.5rem))] pb-10">
      <section class="hero-cinematic reveal relative mt-4 overflow-hidden rounded-3xl border border-white/15 bg-[linear-gradient(120deg,rgba(9,10,20,0.82),rgba(9,10,20,0.26)),url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=2000&q=80')] min-h-[380px] shadow-[0_22px_48px_rgba(6,8,16,0.72)]">
        <div class="absolute inset-0 bg-gradient-to-r from-black/75 to-transparent"></div>
        <div class="relative z-10 p-10 md:p-14">
          <h1 class="text-5xl font-black md:text-7xl">JOIN A <span class="text-orange-400">TEAM</span></h1>
          <p class="mt-3 text-xl text-slate-200/95">Enter the team code to join your squad.</p>
        </div>
      </section>

      <section class="reveal -mt-10 flex justify-center px-2">
        <article id="join-card" class="glass-card neon-border w-full max-w-2xl rounded-3xl p-6 md:p-8">
          <div class="text-center">
            <div class="mx-auto mb-4 h-16 w-16 rounded-full bg-gradient-to-r from-orange-500/80 to-purple-500/70 text-4xl leading-[64px] shadow-[0_0_24px_rgba(255,122,28,0.45)]">👥</div>
            <h2 class="text-3xl font-black md:text-4xl">Unstoppable Legends</h2>
            <p class="mt-2 text-slate-300">Enter your invite code and join the active squad.</p>
          </div>

          <form id="join-form" novalidate class="mx-auto mt-6 grid max-w-xl gap-3">
            <label class="sr-only" for="team-code">Team code</label>
            <input id="team-code" type="text" maxlength="16" placeholder="Enter Team Code" class="h-14 rounded-2xl border border-purple-300/45 bg-black/45 px-4 text-lg outline-none transition focus:border-orange-400 focus:shadow-[0_0_20px_rgba(255,122,28,0.45)]" />
            <button type="submit" class="rounded-2xl bg-gradient-to-r from-orange-500 via-orange-400 to-amber-300 px-5 py-3 text-2xl font-black text-slate-950 shadow-[0_0_26px_rgba(255,122,28,0.55)] transition hover:scale-105">Join Team</button>
            <p id="join-message" class="min-h-6 text-center text-sm font-semibold" aria-live="polite"></p>
          </form>
        </article>
      </section>

      <section class="reveal mt-10">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-3xl font-black">ACTIVE PLAYERS</h2>
          <span class="rounded-xl border border-white/25 bg-white/5 px-3 py-2 text-sm font-bold">🛡 5/12</span>
        </div>
        <div id="players-grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
      </section>

      <footer class="mt-14 flex flex-wrap items-center justify-center gap-6 border-t border-white/15 py-6 text-sm text-slate-300/90">
        <a href="#">About</a><a href="#">Contact</a><a href="#">Privacy Policy</a><a href="#">Terms & Conditions</a>
      </footer>
    </main>

    <script src="join.js"></script>
    <script src="ui-effects.js"></script>
  </body>
</html>
