<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Join Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>

    <header class="navbar glass">
      <a class="brand" href="index.html" aria-label="GameVerse home">
        <span class="brand__icon">🎮</span>
        <span class="brand__text">GameVerse</span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="#">Leaderboard</a>
        <a class="nav-link nav-link--active" href="join-team.html">Join Team</a>
      </nav>

      <div class="nav-actions">
        <button class="btn btn--ghost">Logout</button>
        <button class="avatar-btn" aria-label="Profile menu">👾</button>
      </div>
    </header>

    <main class="join-page">
      <section class="join-hero reveal">
        <div class="game-hero__overlay"></div>
        <div class="join-hero__content">
          <h1>JOIN A <span>TEAM</span></h1>
          <p>Enter the team code to join your squad!</p>
        </div>
      </section>

      <section class="join-card-wrap reveal">
        <article id="join-card" class="join-card glass">
          <div class="join-card__icon">👥</div>
          <h2>Unstoppable Legends</h2>
          <p>Enter the team code to join your squad!</p>

          <form id="join-form" novalidate>
            <label class="sr-only" for="team-code">Team code</label>
            <input id="team-code" type="text" placeholder="Enter Team Code" maxlength="16" />
            <button class="btn btn--hero join-btn" type="submit">Join Team</button>
            <p id="join-message" class="join-message" role="status" aria-live="polite"></p>
          </form>
        </article>
      </section>

      <section class="players-section reveal">
        <div class="section-header">
          <h2>ACTIVE PLAYERS</h2>
          <span class="players-count">🛡 5/12</span>
        </div>
        <div id="players-grid" class="players-grid"></div>
      </section>

      <footer class="site-footer">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms &amp; Conditions</a>
      </footer>
    </main>

    <script src="join.js"></script>
      <script src="ui-effects.js"></script>
  </body>
</html>
