<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Free Fire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>

    <header class="container navbar glass">
      <div class="navbar__inner">
        <a class="brand" href="index.html">🎮 GameVerse</a>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="#">Leaderboard</a>
          <a href="join-team.html">Join Team</a>
        </nav>
        <div class="nav-actions">
          <button class="btn btn--ghost">Login</button>
          <button class="btn btn--primary">Sign Up</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="hero hero--sm reveal">
        <div class="hero__image" style="background-image:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=2100&q=80')"></div>
        <div class="hero__overlay"></div>
        <div class="hero__content" style="padding-top:4rem">
          <h1 class="hero__title" style="font-size:clamp(2.4rem,6vw,4.4rem)">FREE FIRE</h1>
        </div>
      </section>

      <section class="filter-bar glass reveal">
        <div class="filter-wrap">
          <div id="filter-chips" class="chips"></div>
          <label class="search"><span>⌕</span><input id="video-search" type="search" placeholder="Search videos..." /></label>
        </div>
      </section>

      <section class="section reveal" style="margin-top:1.2rem">
        <div id="game-grid" class="video-grid"></div>
        <button id="load-more" class="btn btn--primary" style="display:block;margin:1.8rem auto 0">Load More</button>
      </section>

      <footer class="footer">
        <a href="#">About</a><a href="#">Contact</a><a href="#">Privacy Policy</a><a href="#">Terms & Conditions</a>
      </footer>
    </main>

    <script src="game.js"></script>
    <script src="ui-effects.js"></script>
  </body>
</html>
