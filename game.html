<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>

    <header class="container navbar glass">
      <div class="navbar__inner">
        <a class="brand" href="index.html">🎮 GameVerse</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="#">Leaderboard</a>
          <a href="join-team.html">Join Team</a>
        </nav>
        <div class="nav-actions">
          <button class="btn btn-ghost">Login</button>
          <button class="btn btn-primary">Sign Up</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="section hero reveal" style="min-height: 320px; background-image: linear-gradient(120deg, rgba(9,10,20,0.82), rgba(9,10,20,0.2)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=2000&q=80')">
        <div class="hero__content" style="padding-top: 58px">
          <h1 class="hero__title">FREE FIRE</h1>
        </div>
      </section>

      <section class="section toolbar glass reveal">
        <div class="toolbar__inner">
          <div id="filter-chips" class="chips"></div>
          <label class="search">
            <span>⌕</span>
            <input id="video-search" type="search" placeholder="Search videos..." />
          </label>
        </div>
      </section>

      <section class="section reveal">
        <div id="game-grid" class="grid-4"></div>
        <button id="load-more" class="btn btn-primary" style="display:block;margin:26px auto 0;padding:0.75rem 1.4rem;font-size:1.02rem">Load More</button>
      </section>

      <footer class="footer">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms & Conditions</a>
      </footer>
    </main>

    <script src="game.js"></script>
    <script src="ui-effects.js"></script>
  </body>
</html>
