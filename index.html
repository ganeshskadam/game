<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="text-slate-100">
    <div class="page-bg"></div>

    <header class="sticky top-3 z-50 mx-auto mt-4 w-[min(1240px,calc(100%-1.5rem))] rounded-2xl glass-card neon-border px-4 py-3 md:px-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <a class="flex items-center gap-2 text-2xl font-black text-orange-400" href="index.html">🎮 GameVerse</a>
        <nav class="flex items-center gap-6 text-sm font-semibold text-slate-100/90">
          <a class="relative text-orange-200 after:absolute after:-bottom-2 after:left-0 after:h-[2px] after:w-full after:bg-orange-400 after:shadow-[0_0_12px_rgba(255,122,28,0.8)]" href="index.html">Home</a>
          <a class="transition hover:text-orange-200 hover:drop-shadow-[0_0_10px_rgba(255,122,28,0.55)]" href="#">Leaderboard</a>
          <a class="transition hover:text-orange-200 hover:drop-shadow-[0_0_10px_rgba(255,122,28,0.55)]" href="join-team.html">Join Team</a>
        </nav>
        <div class="flex items-center gap-2">
          <button class="rounded-lg border border-purple-400/50 bg-slate-900/70 px-4 py-2 text-sm font-semibold">Login</button>
          <button class="rounded-lg bg-gradient-to-r from-orange-500 to-amber-400 px-4 py-2 text-sm font-bold text-slate-950 shadow-[0_0_20px_rgba(255,122,28,0.45)] transition hover:scale-105">Sign Up</button>
        </div>
      </div>
    </header>

    <main class="mx-auto w-[min(1240px,calc(100%-1.5rem))] pb-10">
      <section class="hero-cinematic reveal relative mt-4 overflow-hidden rounded-3xl border border-white/15 bg-[linear-gradient(120deg,rgba(9,10,20,0.86),rgba(9,10,20,0.24)),url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=2000&q=80')] min-h-[560px] shadow-[0_26px_60px_rgba(6,8,16,0.72)]">
        <div class="absolute inset-0 bg-gradient-to-r from-black/70 via-black/35 to-transparent"></div>
        <div class="relative z-10 max-w-xl p-8 pt-24 md:p-16">
          <p class="mb-2 text-sm font-bold uppercase tracking-[0.25em] text-orange-300">GameVerse</p>
          <h1 class="text-5xl font-black leading-[0.95] md:text-7xl">WATCH.<br /><span class="text-orange-400">PLAY.</span><br /><span class="text-orange-300">DOMINATE.</span></h1>
          <p class="mt-5 text-lg text-slate-200/90">A cinematic gaming video platform inspired by Netflix and esports dashboards.</p>
          <a href="game.html" class="mt-7 inline-flex items-center rounded-xl bg-gradient-to-r from-orange-500 via-orange-400 to-amber-300 px-7 py-3 text-lg font-black text-slate-950 shadow-[0_0_28px_rgba(255,122,28,0.55)] transition hover:scale-105">Explore Games</a>
        </div>
      </section>

      <section class="reveal mt-10 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-3xl font-black tracking-wide">FREE FIRE 🔥</h2>
          <a href="game.html" class="rounded-lg border border-purple-400/45 bg-white/5 px-4 py-2 text-sm font-semibold shadow-[0_0_14px_rgba(138,92,255,0.25)] transition hover:translate-x-1 hover:text-orange-200">See All →</a>
        </div>
        <div id="video-grid" class="scroll-row"></div>
      </section>

      <footer class="mt-14 flex flex-wrap items-center justify-center gap-6 border-t border-white/15 py-6 text-sm text-slate-300/90">
        <a href="#">About</a><a href="#">Contact</a><a href="#">Privacy Policy</a><a href="#">Terms & Conditions</a>
      </footer>
    </main>

    <script src="script.js"></script>
    <script src="ui-effects.js"></script>
  </body>
</html>
