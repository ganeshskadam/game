<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Video Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>

    <header class="container navbar glass">
      <div class="navbar__inner">
        <a class="brand" href="index.html">🎮 GameVerse</a>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="#">Leaderboard</a>
          <a href="join-team.html">Join Team</a>
        </nav>
        <div class="nav-actions">
          <button class="btn btn--ghost">Logout</button>
          <button class="btn btn--ghost">👾</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="hero hero--sm reveal">
        <div class="hero__image" style="background-image:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=2100&q=80')"></div>
        <div class="hero__overlay"></div>
        <div class="hero__content" style="padding-top:4rem">
          <h1 class="hero__title" style="font-size:clamp(2.4rem,6vw,4.4rem)">FREE FIRE</h1>
        </div>
      </section>

      <section class="player-layout reveal">
        <article class="panel glass">
          <div class="title-row">
            <h2 id="video-title">Epic Headshots and Insane Gameplay!</h2>
            <button id="like-button" class="like-btn">❤️ <span id="like-count">34.7K</span></button>
          </div>
          <p id="video-views" class="muted">1.2M views</p>

          <div class="video-frame" style="margin-top:0.8rem">
            <iframe id="video-frame" src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0" title="GameVerse video" allowfullscreen loading="lazy"></iframe>
          </div>

          <div style="margin-top:1rem; border-top:1px solid rgba(255,255,255,0.12); padding-top:1rem" class="title-row">
            <div>
              <h3 id="video-title-bottom" style="margin:0; font-size:1.35rem">Epic Headshots and Insane Gameplay!</h3>
              <p id="video-views-bottom" class="muted" style="margin:0.2rem 0 0">1.2M views</p>
            </div>
            <button id="like-button-bottom" class="like-btn">❤️ <span id="like-count-bottom">34.7K</span></button>
          </div>
        </article>

        <aside class="panel glass">
          <h3 style="margin:0 0 0.8rem; font-size:1.6rem">Related Videos</h3>
          <div id="related-list" class="related-list"></div>
        </aside>
      </section>

      <footer class="footer">
        <a href="#">About</a><a href="#">Contact</a><a href="#">Privacy Policy</a><a href="#">Terms & Conditions</a>
      </footer>
    </main>

    <script src="player.js"></script>
    <script src="ui-effects.js"></script>
  </body>
</html>
