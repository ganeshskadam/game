<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="text-slate-100">
    <div class="page-bg"></div>

    <header class="sticky top-3 z-50 mx-auto mt-4 w-[min(1240px,calc(100%-1.5rem))] rounded-2xl glass-card neon-border px-4 py-3 md:px-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <a class="flex items-center gap-2 text-2xl font-black text-orange-400" href="index.html">🎮 GameVerse</a>
        <nav class="flex items-center gap-6 text-sm font-semibold text-slate-100/90">
          <a class="transition hover:text-orange-200" href="index.html">Home</a>
          <a class="transition hover:text-orange-200" href="#">Leaderboard</a>
          <a class="transition hover:text-orange-200" href="join-team.html">Join Team</a>
        </nav>
        <div class="flex items-center gap-2">
          <button class="rounded-lg border border-purple-400/50 bg-slate-900/70 px-4 py-2 text-sm font-semibold">Logout</button>
          <button class="rounded-full border border-purple-400/60 bg-black/35 p-2 shadow-[0_0_14px_rgba(138,92,255,0.35)]">👾</button>
        </div>
      </div>
    </header>

    <main class="mx-auto w-[min(1240px,calc(100%-1.5rem))] pb-10">
      <section class="hero-cinematic reveal relative mt-4 overflow-hidden rounded-3xl border border-white/15 bg-[linear-gradient(120deg,rgba(9,10,20,0.82),rgba(9,10,20,0.26)),url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=2000&q=80')] min-h-[260px] shadow-[0_22px_48px_rgba(6,8,16,0.72)]">
        <div class="absolute inset-0 bg-gradient-to-r from-black/70 to-transparent"></div>
        <h1 class="relative z-10 p-10 text-5xl font-black md:p-14 md:text-7xl">FREE FIRE</h1>
      </section>

      <section class="reveal mt-6 grid gap-5 lg:grid-cols-[minmax(0,2fr)_360px]">
        <article class="glass-card neon-border rounded-2xl p-4 md:p-5">
          <header class="flex flex-wrap items-start justify-between gap-3">
            <h2 id="video-title" class="text-2xl font-black md:text-3xl">Epic Headshots and Insane Gameplay!</h2>
            <button id="like-button" class="rounded-xl border border-orange-300/65 bg-gradient-to-r from-orange-500/45 to-purple-500/35 px-4 py-2 text-sm font-bold shadow-[0_0_16px_rgba(255,122,28,0.42)] transition hover:scale-105">❤️ <span id="like-count">34.7K</span></button>
          </header>
          <p id="video-views" class="mt-2 text-sm text-slate-300">1.2M views</p>

          <div class="mt-4 overflow-hidden rounded-2xl border border-orange-300/45 shadow-[0_24px_48px_rgba(8,10,18,0.72),0_0_22px_rgba(138,92,255,0.25)]">
            <iframe id="video-frame" src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0" title="GameVerse video player" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen class="aspect-video w-full border-0"></iframe>
          </div>

          <div class="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-white/15 pt-4">
            <div>
              <h3 id="video-title-bottom" class="text-xl font-black">Epic Headshots and Insane Gameplay!</h3>
              <p id="video-views-bottom" class="text-sm text-slate-300">1.2M views</p>
            </div>
            <button id="like-button-bottom" class="rounded-xl border border-orange-300/65 bg-gradient-to-r from-orange-500/45 to-purple-500/35 px-4 py-2 text-sm font-bold shadow-[0_0_16px_rgba(255,122,28,0.42)] transition hover:scale-105">❤️ <span id="like-count-bottom">34.7K</span></button>
          </div>
        </article>

        <aside class="glass-card neon-border rounded-2xl p-4 md:p-5">
          <h3 class="mb-3 text-2xl font-black">Related Videos</h3>
          <div id="related-list" class="space-y-3"></div>
        </aside>
      </section>

      <footer class="mt-14 flex flex-wrap items-center justify-center gap-6 border-t border-white/15 py-6 text-sm text-slate-300/90">
        <a href="#">About</a><a href="#">Contact</a><a href="#">Privacy Policy</a><a href="#">Terms & Conditions</a>
      </footer>
    </main>

    <script src="player.js"></script>
    <script src="ui-effects.js"></script>
  </body>
</html>
